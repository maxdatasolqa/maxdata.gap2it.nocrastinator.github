<!DOCTYPE html>
<html>
<head>
    <title>Register - NoCrastinator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h2>Register</h2>

        <div class="mb-3">
            <input id="regEmail" class="form-control" placeholder="Email">
        </div>

        <div class="mb-3">
            <input id="regPassword" type="password" class="form-control" placeholder="Password">
        </div>

        <div class="mb-3">
            <input id="regPhone" class="form-control" placeholder="Phone (optional)">
        </div>

        <button class="btn btn-success w-100" onclick="register()">Register</button>

        <div class="mt-3">
            <a href="/">Back to Login</a>
        </div>
    </div>

    <script src="nc.js"></script>
</body>
</html>
