<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>No‑Crastinator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container mt-4">
        <h1 class="mb-4">No‑Crastinator</h1>
        <div class="card mb-4" id="loginSection">
            <div class="card-body">
                <h5>Login</h5>

                <div class="row g-2">
                    <div class="col-md-4">
                        <input id="loginEmail" class="form-control" placeholder="Email">
                    </div>

                    <div class="col-md-4">
                        <input id="loginPassword" type="password" class="form-control" placeholder="Password">
                    </div>

                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" onclick="login()">Login</button>
                    </div>

                    <div class="mt-2">
                        <a href="/register.html">Register</a>
                    </div>

                </div>
            </div>
        </div>
        <div id="logoutSection">
            <button class="btn btn-secondary mb-3" onclick="logout()">Logout</button>
        </div>
        <!-- ✅ User Switch (MVP hack instead of auth) -->
        <div id="appSection">
            <h6 id="currentUserInfo"></h6>
            
            <h5 id="userPoints"></h5>
            <div class="card mb-4">
                <div class="card-body">
                    <h5>Create Goal</h5>

                    <div class="row g-2">
                        <div class="col-md-3">
                            <input type="text" id="title" class="form-control" placeholder="Title">
                        </div>

                        <div class="col-md-3">
                            <input type="text" id="description" class="form-control" placeholder="Description">
                        </div>

                        <div class="col-md-2">
                            <input type="number" id="points" class="form-control" placeholder="Points">
                        </div>

                        <div class="col-md-2">
                            <input type="date" id="dueDate" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <button class="btn btn-success w-100" onclick="createGoal()">Create</button>
                        </div>
                    </div>

                    <div id="createError" class="text-danger mt-2"></div>
                </div>
            </div>

            <!-- ✅ Goals Table -->
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Points</th>
                        <th>Progress (%)</th>
                        <th>Due Date</th>
                        <th>Update</th>
                        <th>Assessment</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="goalsTable"></tbody>
            </table>
            <button onclick="evaluateAll()" class="btn btn-warning">
                Run Evaluation
            </button>
        </div>
    </div>

   

    <!-- ✅ JS -->
    <script src="nc.js"></script>

</body>
</html>
